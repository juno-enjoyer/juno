<html lang="en">

    <link rel="icon" href="assets/fav.png" type="image/png">

</head>

<body>

    <div id="bg"></div>

    <div id="entrance" onclick="enterSite()">
        <p>click to enter</p>
    </div>

    <div id="scroll-container">
        <div class="section" id="section1" style="position: relative;">
            <div id="main">
                <div class="pfp-container pop-element">
                    <img src="https://avatar-cyan.vercel.app/api/pfp/987994517678477323/image" alt="Profile Picture" class="pfp-img">
                    <img src="assets/effect.png" alt="Effect" class="pfp-effect">

                <div class="info-container">
                    <div class="name-container pop-element delay-1">

                        <a href="https://www.instagram.com/azi.zben/" target="_blank"
                            rel="noopener noreferrer">
                            <img src="assets/instagram.png" alt="Instagram">
                        </a>
                        <div class="icon-btn" onclick="copyBnet(event)" role="button" aria-label="Copy Battle.net Tag">

                        </div>
                    </div>

            </div>
            <div class="pop-element delay-4"
                style="position: absolute; bottom: 10vh; left: 50%; transform: translateX(-50%);">
                <img src="assets/cute.gif" alt="cute gif" style="width: 120px; border-radius: 8px;">
            </div>

    <audio id="bgMusic" src="assets/s.mp3" loop preload="auto"></audio>
